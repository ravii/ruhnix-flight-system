name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything runs inside the same dev image developers use (docker/Dockerfile),
# so CI and local results match.
jobs:
  build:
    name: format + build + test (Ubuntu 26.04 container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: bash scripts/docker.sh build

      - name: Check formatting
        run: bash scripts/docker.sh run bash scripts/format.sh --check

      - name: Build and test all modules
        run: bash scripts/docker.sh run bash scripts/build_all.sh

