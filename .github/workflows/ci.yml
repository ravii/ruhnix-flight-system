name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: ${{ matrix.module }} (host)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [common, flight-controller, esc, perception, localization]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ${{ matrix.module }} -B build -DUAV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

